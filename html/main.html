
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fafafa">
<title>Static Player</title>

<style>
:root {
    color-scheme: light;
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-hover: #f4f4f5;
    --foreground: #18181b;
    --muted: #71717a;
    --border: #e4e4e7;
    --accent: #18181b;
    --accent-foreground: #fafafa;
    --subtle: #f4f4f5;
    --radius: 10px;
    --player-height: 108px;
}

* {
    box-sizing: border-box;
    text-rendering: optimizeLegibility;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--foreground);
    font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Helvetica Neue",
        Arial, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
}

button, input {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    cursor: not-allowed;
    opacity: .35;
}

a {
    color: inherit;
}

/* Icons */

.icon {
    width: 18px;
    height: 18px;
    display: block;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* Header */

.header {
    height: 64px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,.85);
    display: flex;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(12px);
}

.header-inner {
    width: 100%;
    max-width: 1100px;
    padding: 0 24px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -.4px;
    white-space: nowrap;
}

.brand-icon {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--accent);
    color: white;
    display: grid;
    place-items: center;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.library-count {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
}

/* Main */

.main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 38px 24px calc(var(--player-height) + 70px);
}

.page-heading {
    margin-bottom: 28px;
}

.page-heading h1 {
    font-size: 25px;
    letter-spacing: -.8px;
    margin: 0 0 7px;
    font-weight: 650;
}

.page-heading p {
    color: var(--muted);
    margin: 0;
    font-size: 13px;
}

/* Search */

.search-box {
    position: relative;
    width: 260px;
}

.search-box .icon {
    position: absolute;
    top: 50%;
    left: 11px;
    transform: translateY(-50%);
    color: var(--muted);
    width: 16px;
    height: 16px;
}

.search-box input {
    height: 36px;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 12px 0 35px;
    outline: none;
    background: var(--surface);
    color: var(--foreground);
    font-size: 13px;
    transition: border-color .15s, box-shadow .15s;
}

.search-box input:focus {
    border-color: #a1a1aa;
    box-shadow: 0 0 0 3px rgba(24,24,27,.06);
}

.search-box input::placeholder {
    color: #a1a1aa;
}

/* Section */

.section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
}

.section-heading h2 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
}

.section-count {
    color: var(--muted);
    font-size: 12px;
}

/* Album cards */

.albums-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.album-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color .15s;
}

.album-card:hover {
    border-color: #d4d4d8;
}

.album-header {
    display: flex;
    align-items: center;
    gap: 13px;
    min-height: 66px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
}

.album-header:hover {
    background: #fafafa;
}

.album-art {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: #f4f4f5;
    display: grid;
    place-items: center;
    color: #71717a;
    flex-shrink: 0;
}

.album-art .icon {
    width: 20px;
    height: 20px;
}

.album-info {
    flex: 1;
    min-width: 0;
}

.album-title {
    font-weight: 600;
    font-size: 13px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    margin-bottom: 5px;
}

.album-meta {
    color: var(--muted);
    font-size: 12px;
}

.album-chevron {
    color: var(--muted);
    transition: transform .2s;
}

.album-card[data-expanded="expanded"] .album-chevron {
    transform: rotate(180deg);
}

.album-tracks {
    border-top: 1px solid var(--border);
    padding: 5px 10px;
}

.album-card[data-expanded="collapsed"] .album-tracks {
    display: none;
}

/* Track rows */

.track-row {
    display: flex;
    align-items: center;
    min-height: 42px;
    padding: 0 10px;
    gap: 12px;
    border-radius: 6px;
    color: #52525b;
    cursor: pointer;
    transition: background .12s, color .12s;
}

.track-row:hover {
    background: var(--surface-hover);
    color: var(--foreground);
}

.track-row.active {
    background: #f4f4f5;
    color: var(--foreground);
}

.track-number {
    width: 22px;
    text-align: center;
    color: #a1a1aa;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
}

.track-row.active .track-number {
    color: var(--foreground);
}

.track-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 13px;
}

.track-row.active .track-title {
    font-weight: 600;
}

.track-status {
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
}

.track-playing-icon {
    color: var(--foreground);
    display: none;
}

.track-row.active .track-playing-icon {
    display: block;
}

/* Empty state */

.empty-state {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 55px 20px;
    text-align: center;
    color: var(--muted);
}

.empty-state .icon {
    width: 32px;
    height: 32px;
    margin: 0 auto 12px;
}

.empty-state p {
    margin: 0;
    font-size: 13px;
}

/* Footer */

.footer {
    padding: 35px 15px 20px;
    text-align: center;
    color: #a1a1aa;
    font-size: 11px;
    line-height: 1.8;
}

.footer a {
    text-decoration: underline;
    text-underline-offset: 3px;
}

/* Player */

.player {
    position: fixed;
    z-index: 20;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
}

.player-inner {
    max-width: 1100px;
    margin: auto;
    min-height: 96px;
    padding: 14px 24px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 24px;
}

.now-playing {
    min-width: 0;
}

.now-playing-title {
    font-weight: 600;
    font-size: 13px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    margin-bottom: 5px;
}

.now-playing-album {
    color: var(--muted);
    font-size: 12px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.player-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
}

.control-btn {
    border: 0;
    background: transparent;
    color: #52525b;
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 7px;
}

.control-btn:hover:not(:disabled) {
    background: var(--surface-hover);
    color: var(--foreground);
}

.control-btn.primary {
    background: var(--accent);
    color: var(--accent-foreground);
    width: 40px;
    height: 40px;
    border-radius: 50%;
}

.control-btn.primary:hover {
    background: #3f3f46;
    color: white;
}

.control-btn.primary .icon {
    width: 19px;
    height: 19px;
}

.player-progress {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
    justify-content: flex-end;
}

.time {
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}

.progress-range {
    appearance: none;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 99px;
    background: #e4e4e7;
    cursor: pointer;
    width: 130px;
    outline: none;
}

.progress-range::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #18181b;
    border: 0;
}

.progress-range::-moz-range-thumb {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #18181b;
    border: 0;
}

.progress-range:disabled {
    cursor: default;
    opacity: .5;
}

/* Responsive */

@media (max-width: 650px) {
    .header-inner {
        padding: 0 16px;
    }

    .header-right {
        flex: 1;
        justify-content: flex-end;
    }

    .search-box {
        width: min(190px, 100%);
    }

    .main {
        padding: 28px 14px calc(var(--player-height) + 60px);
    }

    .page-heading h1 {
        font-size: 22px;
    }

    .player-inner {
        padding: 12px 14px;
        grid-template-columns: 1fr auto;
        gap: 8px;
        min-height: 105px;
    }

    .now-playing {
        grid-column: 1;
        grid-row: 1;
    }

    .player-controls {
        grid-column: 2;
        grid-row: 1;
        gap: 5px;
    }

    .player-progress {
        grid-column: 1 / -1;
        grid-row: 2;
        justify-content: space-between;
    }

    .progress-range {
        flex: 1;
        width: auto;
    }

    .player {
        padding-bottom: env(safe-area-inset-bottom);
    }

    .library-count {
        display: none;
    }
}

@media (max-width: 380px) {
    .brand {
        font-size: 14px;
    }

    .brand-icon {
        width: 29px;
        height: 29px;
    }

    .search-box {
        width: 145px;
    }

    .control-btn {
        width: 29px;
        height: 29px;
    }

    .control-btn.primary {
        width: 36px;
        height: 36px;
    }
}
</style>
</head>

<body>

<!-- Inline SVG icons -->
<svg xmlns="http://www.w3.org/2000/svg"
     style="display:none">

    <symbol id="i-music" viewBox="0 0 24 24">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
    </symbol>

    <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
    </symbol>

    <symbol id="i-chevron" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6"/>
    </symbol>

    <symbol id="i-disc" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v7"/>
    </symbol>

    <symbol id="i-play" viewBox="0 0 24 24">
        <path d="m7 4 14 8-14 8z" fill="currentColor" stroke="none"/>
    </symbol>

    <symbol id="i-pause" viewBox="0 0 24 24">
        <path d="M7 4h4v16H7zM15 4h4v16h-4z"
              fill="currentColor" stroke="none"/>
    </symbol>

    <symbol id="i-prev" viewBox="0 0 24 24">
        <path d="m19 20-9-8 9-8z" fill="currentColor" stroke="none"/>
        <path d="M5 5v14"/>
    </symbol>

    <symbol id="i-next" viewBox="0 0 24 24">
        <path d="m5 4 9 8-9 8z" fill="currentColor" stroke="none"/>
        <path d="M19 5v14"/>
    </symbol>

    <symbol id="i-wave" viewBox="0 0 24 24">
        <path d="M2 10v4m4-8v12m4-16v20m4-14v8m4-12v16m4-10v4"/>
    </symbol>
</svg>

<header class="header">
    <div class="header-inner">
        <div class="brand">
            <div class="brand-icon">
                <svg class="icon"><use href="#i-music"/></svg>
            </div>
            <span>Static Player</span>
        </div>

        <div class="header-right">
            <span class="library-count" id="libraryCount">
                Loading library...
            </span>

            <div class="search-box">
                <svg class="icon"><use href="#i-search"/></svg>
                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search tracks..."
                    autocomplete="off"
                    aria-label="Search tracks">
            </div>
        </div>
    </div>
</header>

<main class="main">

    <div class="page-heading">
        <h1>Music Library</h1>
        <p>Your personal music collection.</p>
    </div>

    <div class="section-heading">
        <h2>Albums</h2>
        <span class="section-count" id="albumCount"></span>
    </div>

    <div class="albums-list" id="albumsList">
        <div class="empty-state">
            Loading music library...
        </div>
    </div>

    <footer class="footer">
        Static Player · Stand-alone audio file indexer<br>
        Free software under GNU GPL 2.0<br>
        <a href="https://github.com/neruthes/staticplayer"
           target="_blank" rel="noopener">
            Source code
        </a>
    </footer>

</main>

<!-- Fixed player -->

<div class="player">
    <div class="player-inner">

        <div class="now-playing">
            <div class="now-playing-title" id="activeTrackTitle">
                Not Playing
            </div>
            <div class="now-playing-album" id="activeTrackAlbum">
                Select a track to begin
            </div>
        </div>

        <div class="player-controls">

            <button class="control-btn"
                    id="btnPrev"
                    aria-label="Previous track"
                    title="Previous track">
                <svg class="icon"><use href="#i-prev"/></svg>
            </button>

            <button class="control-btn primary"
                    id="btnPlay"
                    aria-label="Play"
                    title="Play">
                <svg class="icon" id="playIcon">
                    <use href="#i-play"/>
                </svg>
            </button>

            <button class="control-btn"
                    id="btnNext"
                    aria-label="Next track"
                    title="Next track">
                <svg class="icon"><use href="#i-next"/></svg>
            </button>

        </div>

        <div class="player-progress">
            <span class="time" id="timeCurrent">00:00</span>

            <input
                class="progress-range"
                type="range"
                id="progressRange"
                min="0"
                max="100"
                value="0"
                step="0.1"
                disabled
                aria-label="Playback progress">

            <span class="time" id="timeDuration">00:00</span>
        </div>

    </div>
</div>

<script>
(() => {
"use strict";

/* =========================================
   State
========================================= */

const app = window.app = {};

app.lskey = "staticplayer:v1:" + location.pathname + ":";
app.audio = null;
app.serverAudioFiles = [];
app.serverAlbumsArr = [];
app.activeTrackPath = null;
app.playerActiveTrackIndex = -1;
app.playbackState = "paused";
app.searchQuery = "";
app.seekDragging = false;

const $ = id => document.getElementById(id);

const albumsList = $("albumsList");

/* =========================================
   Helpers
========================================= */

app.icon = function(name) {
    const svg = document.createElementNS(
        "http://www.w3.org/2000/svg", "svg"
    );
    svg.classList.add("icon");

    const use = document.createElementNS(
        "http://www.w3.org/2000/svg", "use"
    );
    use.setAttribute("href", "#i-" + name);
    svg.appendChild(use);

    return svg;
};

app.getTrackInfo = function(trackpath) {
    const parts = trackpath.split("/");
    const title = parts.pop();

    const dirpath = parts.join("/");

    return {
        trackpath,
        dirpath,
        title,
        betterDirpath: parts.join(" / ")
    };
};

app.getAlbumTracks = function(dirpath) {
    return app.serverAudioFiles.filter(path => {
        return app.getTrackInfo(path).dirpath === dirpath;
    });
};

app.formatTime = function(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) {
        return "00:00";
    }

    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);

    return String(mins).padStart(2, "0") + ":" +
           String(secs).padStart(2, "0");
};

app.savePlayerState = function() {
    if (!app.activeTrackPath) return;

    try {
        localStorage.setItem(
            app.lskey + "playerState.trackpath",
            app.activeTrackPath
        );
    } catch (e) {
        console.warn("Unable to save player state", e);
    }
};

/* =========================================
   Library rendering
========================================= */

app.renderAlbumsList = function() {
    albumsList.replaceChildren();

    const query = app.searchQuery.toLowerCase();

    let visibleAlbums = 0;
    let visibleTracks = 0;

    app.serverAlbumsArr.forEach(dirpath => {
        const tracks = app.getAlbumTracks(dirpath);

        const matchingTracks = tracks.filter(path => {
            const info = app.getTrackInfo(path);

            return !query ||
                info.title.toLowerCase().includes(query) ||
                dirpath.toLowerCase().includes(query);
        });

        if (matchingTracks.length === 0) return;

        visibleAlbums++;
        visibleTracks += matchingTracks.length;

        const album = document.createElement("section");
        album.className = "album-card";
        album.dataset.dirpath = dirpath;
        album.dataset.expanded = query
            ? "expanded"
            : "collapsed";

        const header = document.createElement("div");
        header.className = "album-header";
        header.setAttribute("role", "button");
        header.tabIndex = 0;
        header.setAttribute("aria-expanded", String(!!query));

        const art = document.createElement("div");
        art.className = "album-art";
        art.appendChild(app.icon("disc"));

        const info = document.createElement("div");
        info.className = "album-info";

        const title = document.createElement("div");
        title.className = "album-title";
        title.textContent = dirpath || "Unknown Album";

        const meta = document.createElement("div");
        meta.className = "album-meta";
        meta.textContent = matchingTracks.length + " tracks";

        info.append(title, meta);

        const chevron = document.createElement("div");
        chevron.className = "album-chevron";
        chevron.appendChild(app.icon("chevron"));

        header.append(art, info, chevron);

        const trackContainer = document.createElement("div");
        trackContainer.className = "album-tracks";

        matchingTracks.forEach(path => {
            const track = app.getTrackInfo(path);
            const index = app.serverAudioFiles.indexOf(path);

            const row = document.createElement("div");
            row.className = "track-row";
            row.dataset.trackpath = path;
            row.tabIndex = 0;
            row.setAttribute("role", "button");

            if (path === app.activeTrackPath) {
                row.classList.add("active");
            }

            const number = document.createElement("span");
            number.className = "track-number";
            number.textContent = String(index + 1).padStart(2, "0");

            const name = document.createElement("span");
            name.className = "track-title";
            name.textContent = track.title;

            const status = document.createElement("span");
            status.className = "track-status";

            if (path === app.activeTrackPath) {
                status.appendChild(app.icon("wave"));
                status.className = "track-playing-icon";
            }

            row.append(number, name, status);

            row.addEventListener("click", () => {
                app.setActiveTrack(path, {});
            });

            row.addEventListener("keydown", e => {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    app.setActiveTrack(path, {});
                }
            });

            trackContainer.appendChild(row);
        });

        const toggle = () => {
            const expanded =
                album.dataset.expanded === "expanded";

            album.dataset.expanded =
                expanded ? "collapsed" : "expanded";

            header.setAttribute(
                "aria-expanded",
                String(!expanded)
            );
        };

        header.addEventListener("click", toggle);

        header.addEventListener("keydown", e => {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                toggle();
            }
        });

        album.append(header, trackContainer);
        albumsList.appendChild(album);
    });

    $("albumCount").textContent =
        visibleAlbums + " albums";

    $("libraryCount").textContent =
        app.serverAudioFiles.length + " tracks";

    if (visibleAlbums === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.appendChild(app.icon("search"));

        const text = document.createElement("p");
        text.textContent = app.searchQuery
            ? "No tracks found. Try another search."
            : "No music files found.";

        empty.appendChild(text);
        albumsList.appendChild(empty);
    }

    return visibleTracks;
};

/* =========================================
   Player UI
========================================= */

app.setPlayPauseButtonState = function(state) {
    app.playbackState = state;

    const icon = $("playIcon").querySelector("use");

    icon.setAttribute(
        "href",
        state === "playing" ? "#i-pause" : "#i-play"
    );

    $("btnPlay").setAttribute(
        "aria-label",
        state === "playing" ? "Pause" : "Play"
    );
};

app.updateNavigationButtons = function() {
    $("btnPrev").disabled =
        app.playerActiveTrackIndex <= 0;

    $("btnNext").disabled =
        app.playerActiveTrackIndex < 0 ||
        app.playerActiveTrackIndex >=
        app.serverAudioFiles.length - 1;
};

app.updateTrackHighlight = function() {
    document.querySelectorAll(".track-row").forEach(row => {
        const active =
            row.dataset.trackpath === app.activeTrackPath;

        row.classList.toggle("active", active);

        const number = row.querySelector(".track-number");
        const status = row.querySelector(".track-status");

        if (active && status) {
            status.className = "track-playing-icon";
            status.replaceChildren(app.icon("wave"));
        } else if (status) {
            status.className = "track-status";
            status.replaceChildren();
        }
    });
};

app.updateProgress = function() {
    if (!app.audio) return;

    const current = app.audio.currentTime || 0;
    const duration = app.audio.duration || 0;

    $("timeCurrent").textContent =
        app.formatTime(current);

    $("timeDuration").textContent =
        app.formatTime(duration);

    const range = $("progressRange");

    range.disabled = !Number.isFinite(duration) || duration <= 0;

    if (!app.seekDragging) {
        range.value = duration > 0
            ? current / duration * 100
            : 0;
    }
};

/* =========================================
   Track selection
========================================= */

app.setActiveTrack = function(trackpath, opts = {}) {
    const index = app.serverAudioFiles.indexOf(trackpath);

    if (index === -1) return;

    if (app.audio) {
        app.audio.pause();
        app.audio.onended = null;
        app.audio.onerror = null;
    }

    app.audio = new Audio(trackpath);
    app.audio.preload = "metadata";

    app.activeTrackPath = trackpath;
    app.playerActiveTrackIndex = index;

    const info = app.getTrackInfo(trackpath);

    $("activeTrackTitle").textContent =
        info.title + " (" + (index + 1) +
        "/" + app.serverAudioFiles.length + ")";

    $("activeTrackAlbum").textContent =
        info.betterDirpath || "Unknown Album";

    app.audio.addEventListener("timeupdate", () => {
        app.updateProgress();
    });

    app.audio.addEventListener("loadedmetadata", () => {
        app.updateProgress();
    });

    app.audio.addEventListener("durationchange", () => {
        app.updateProgress();
    });

    app.audio.addEventListener("play", () => {
        app.setPlayPauseButtonState("playing");
    });

    app.audio.addEventListener("pause", () => {
        app.setPlayPauseButtonState("paused");
    });

    app.audio.addEventListener("ended", () => {
        app.playNextInLibrary({
            isAutomaticNext: true
        });
    });

    app.audio.addEventListener("error", () => {
        $("activeTrackAlbum").textContent =
            "Unable to load audio file";
        app.setPlayPauseButtonState("paused");
    });

    app.updateNavigationButtons();
    app.updateTrackHighlight();

    const album = [...document.querySelectorAll(".album-card")]
        .find(node => node.dataset.dirpath === info.dirpath);

    if (album) {
        album.dataset.expanded = "expanded";
    }

    app.savePlayerState();

    $("progressRange").value = 0;
    app.updateProgress();

    if (!opts.asPaused) {
        app.play();
    }
};

/* =========================================
   Playback
========================================= */

app.play = async function() {
    if (!app.audio) {
        if (app.serverAudioFiles.length === 0) return;

        app.setActiveTrack(app.serverAudioFiles[0], {
            asPaused: true
        });
    }

    try {
        await app.audio.play();
        app.setPlayPauseButtonState("playing");
    } catch (error) {
        console.warn("Playback failed:", error);
        app.setPlayPauseButtonState("paused");
    }
};

app.pause = function() {
    if (app.audio) {
        app.audio.pause();
    }

    app.setPlayPauseButtonState("paused");
};

app.didClickPlayPauseButton = function() {
    if (app.playbackState === "playing") {
        app.pause();
    } else {
        app.play();
    }
};

app.playNextInLibrary = function(opts = {}) {
    const next = app.playerActiveTrackIndex + 1;

    if (next >= app.serverAudioFiles.length) return;

    app.setActiveTrack(app.serverAudioFiles[next], {
        asPaused: !!opts.asPaused
    });
};

app.playPrevInLibrary = function() {
    const prev = app.playerActiveTrackIndex - 1;

    if (prev < 0) return;

    app.setActiveTrack(app.serverAudioFiles[prev], {});
};

/* =========================================
   Progress seeking
========================================= */

$("progressRange").addEventListener("input", e => {
    app.seekDragging = true;

    if (!app.audio || !Number.isFinite(app.audio.duration)) {
        return;
    }

    const target =
        app.audio.duration * Number(e.target.value) / 100;

    $("timeCurrent").textContent = app.formatTime(target);
});

$("progressRange").addEventListener("change", e => {
    if (app.audio && Number.isFinite(app.audio.duration)) {
        app.audio.currentTime =
            app.audio.duration * Number(e.target.value) / 100;
    }

    app.seekDragging = false;
    app.updateProgress();
});

$("progressRange").addEventListener("pointerup", () => {
    app.seekDragging = false;
});

/* =========================================
   Search
========================================= */

$("searchInput").addEventListener("input", e => {
    app.searchQuery = e.target.value.trim();
    app.renderAlbumsList();
});

/* =========================================
   Player controls
========================================= */

$("btnPlay").addEventListener("click", () => {
    app.didClickPlayPauseButton();
});

$("btnPrev").addEventListener("click", () => {
    app.playPrevInLibrary();
});

$("btnNext").addEventListener("click", () => {
    app.playNextInLibrary({});
});

/* Keyboard shortcuts */

document.addEventListener("keydown", e => {
    if (
        e.target instanceof HTMLInputElement ||
        e.target instanceof HTMLTextAreaElement ||
        e.target.isContentEditable
    ) return;

    if (e.code === "Space") {
        e.preventDefault();
        app.didClickPlayPauseButton();
    }

    if (e.code === "ArrowRight" && app.audio) {
        app.audio.currentTime = Math.min(
            app.audio.currentTime + 5,
            app.audio.duration || app.audio.currentTime + 5
        );
    }

    if (e.code === "ArrowLeft" && app.audio) {
        app.audio.currentTime = Math.max(
            0,
            app.audio.currentTime - 5
        );
    }
});

/* =========================================
   Library initialization
========================================= */

app.initializePlayerContext = function(findTxt) {

    app.serverAudioFiles = findTxt
        .trim()
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line =>
            /\.(wav|aiff|aif|m4a|flac|ape|mp3|mp4)$/i.test(line)
        )
        .slice(0, 3000);

    // Preserve the original library order.
    const albumMap = new Map();

    app.serverAudioFiles.forEach(path => {
        const dir = app.getTrackInfo(path).dirpath;

        if (!albumMap.has(dir)) {
            albumMap.set(dir, true);
        }
    });

    app.serverAlbumsArr = [...albumMap.keys()];

    app.renderAlbumsList();

    if (app.serverAudioFiles.length === 0) {
        $("activeTrackTitle").textContent = "No tracks found";
        $("activeTrackAlbum").textContent =
            "Check your .find.txt index";
        app.updateNavigationButtons();
        return;
    }

    // URL parameter: ?track=N
    const params = new URLSearchParams(location.search);
    const trackIndex = Number(params.get("track"));

    if (
        params.has("track") &&
        Number.isInteger(trackIndex) &&
        trackIndex >= 0 &&
        trackIndex < app.serverAudioFiles.length
    ) {
        app.setActiveTrack(
            app.serverAudioFiles[trackIndex],
            { asPaused: true }
        );
        return;
    }

    // Restore previous track.
    let savedTrackPath = null;

    try {
        savedTrackPath = localStorage.getItem(
            app.lskey + "playerState.trackpath"
        );
    } catch (e) {
        console.warn("Unable to read player state", e);
    }

    const initialTrack =
        app.serverAudioFiles.includes(savedTrackPath)
            ? savedTrackPath
            : app.serverAudioFiles[0];

    app.setActiveTrack(initialTrack, {
        asPaused: true
    });
};

/* =========================================
   Load index
========================================= */

app.loadLibrary = async function() {
    try {
        const response = await fetch(".find.txt", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const text = await response.text();

        app.initializePlayerContext(text);

    } catch (error) {
        console.error("Library loading failed:", error);

        albumsList.replaceChildren();

        const empty = document.createElement("div");
        empty.className = "empty-state";

        const message = document.createElement("p");
        message.textContent =
            "Unable to load .find.txt. Check that the file exists and the page is served over HTTP.";

        empty.appendChild(message);
        albumsList.appendChild(empty);

        $("libraryCount").textContent = "Library unavailable";
    }
};

/* Start */

app.loadLibrary();

})();
</script>

</body>
</html>
